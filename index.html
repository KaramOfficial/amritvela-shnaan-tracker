<style>
/* ============================================================
   AMRITVELA DESIGN SYSTEM — "Dawn, Held Lightly" (Light Edition)
   Warm paper, one accent, one shadow, word budgets.
   ============================================================ */
:root{
  --fs-caption:13px; --fs-body:15px; --fs-value:28px; --fs-display:32px;
  --lh-tight:1.2; --lh-body:1.6;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --ctl:44px; --ctl-lg:54px;
  --dur-fast:180ms; --dur-med:600ms; --ease:cubic-bezier(.2,.7,.2,1);
  --z-tab:30; --z-scrim:40; --z-sheet:50; --z-overlay:60; --z-popup:70;
  --canvas:#FFF8EC;     /* butter-cream — never pure white */
  --surface:#FFFEF9;    /* cards */
  --sunken:#F3EAD8;     /* quiet fills */
  --ink:#2E241A;        /* warm near-black — never true black */
  --muted:#6F6455;      /* secondary text */
  --hair:#E9DFC9;       /* hairline — spacing preferred */
  --gold:#D89A2E;       /* dawn gold — max twice per screen */
  --gold-tint:#F7E8C8;  /* selection tint */
  --gold-text:#8A5A00;  /* gold dark enough to read as text */
  --water:#7FA8BC;      /* Sleep / Water only */
  --sage:#7A9A6D;       /* kept state only */
  --shadow:0 8px 24px rgba(94,72,32,0.08);
  /* legacy token names kept for inline styles */
  --deep:var(--surface);
  --first:var(--ink);
  --text:var(--ink);
  --serif:"Fraunces",Georgia,serif;
  --sans:"Inter",system-ui,sans-serif;
  --gurmukhi:"Noto Sans Gurmukhi","Inter",sans-serif;
  --r-btn:16px; --r-card:24px;
}
/* Dark — serene warm dusk. Same layout, type and spacing; only the palette swaps. */
:root[data-theme="dark"]{
  --canvas:#141B26;     /* cool night slate */
  --surface:#1E2837;    /* cards */
  --sunken:#0F151E;     /* quiet fills */
  --ink:#E6EBF2;        /* soft cool white — never pure white */
  --muted:#95A3B8;      /* secondary text */
  --hair:rgba(230,235,242,0.12);
  --gold:#D89A2E;       /* dawn gold — primary action + value moment only */
  --gold-tint:#2A3242;  /* selection tint on slate */
  --gold-text:#E9C06A;  /* gold light enough to read on slate */
  --water:#7FA8BC;
  --sage:#8FAE94;
  --shadow:0 8px 24px rgba(0,0,0,0.32);
}
:root[data-theme="dark"] .btn-primary{color:#141B26}
:root[data-theme="dark"] .sheet{box-shadow:0 -8px 24px rgba(0,0,0,0.4)}
:root[data-theme="dark"] .scrim{background:rgba(5,8,14,0.45)}
:root[data-theme="dark"] .popup-wrap{background:rgba(5,8,14,0.5)}
:root[data-theme="dark"] .field{border-color:var(--hair)}
.theme-btn{background:var(--surface);border:none;box-shadow:var(--shadow);border-radius:16px;color:var(--muted);width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px}
:root[data-theme="dark"] button:focus-visible,:root[data-theme="dark"] a:focus-visible,:root[data-theme="dark"] input:focus-visible,:root[data-theme="dark"] summary:focus-visible{outline-color:var(--gold)}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0}
.display{font-family:var(--serif);font-size:32px;line-height:1.15;font-weight:400;color:var(--ink)}
.h1{font-family:var(--serif);font-size:26px;line-height:1.2;font-weight:400;color:var(--ink)}
.h2{font-family:var(--serif);font-size:20px;line-height:1.25;font-weight:400;color:var(--ink)}
.small{font-size:13.5px;color:var(--muted)}
.secondary{color:var(--muted)}
strong{color:var(--ink);font-weight:600}

/* Frame — the app shell is pinned to the REAL visible viewport with
   position:fixed + inset:0, NOT sized with 100vh/100dvh. Root cause of
   the phone "bottom won't scroll" bug: body{overflow:hidden} killed
   document scrolling, so the inner <main> was the only scroller — but
   .frame was sized purely in viewport units. In Android in-app
   WebViews / preview iframes, dvh is unsupported or reported larger
   than the visible area (host chrome / dynamic toolbar), so the frame
   (and main's scrollable overflow) extended past the visible bottom
   and the last content could never be scrolled into view. A fixed
   inset:0 shell always equals the visible viewport in browsers AND
   WebViews; the flex column inside it then gives main a true,
   reachable scroll range and keeps the tab bar pinned. */
.frame{position:fixed;inset:0;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.topbar{display:flex;flex:0 0 auto;align-items:center;gap:10px;padding:14px 24px 6px}
.place-chip{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;background:var(--surface);border:none;box-shadow:var(--shadow);border-radius:16px;color:var(--ink);font-size:13.5px;padding:10px 14px;min-height:44px;text-align:left}
.place-chip .dot-sep{color:var(--muted)}
.place-chip>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#topDate{white-space:nowrap;flex:none}
main{container-type:inline-size;flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;scroll-padding-bottom:44px;padding:6px 24px calc(44px + env(safe-area-inset-bottom))}
.screen{display:none}
.screen.active{display:block}

/* Cards & buttons — shadow OR border, never both */
.card{background:var(--surface);border:none;box-shadow:var(--shadow);border-radius:var(--r-card);padding:20px;margin:0 0 16px}
.btn-primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;background:var(--gold);color:var(--ink);border:none;border-radius:var(--r-btn);font-size:16px;font-weight:600;padding:12px 16px}
.btn-secondary{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;background:var(--sunken);color:var(--ink);border:none;border-radius:var(--r-btn);font-size:16px;font-weight:500;padding:12px 16px}
.link-btn{background:none;border:none;color:var(--gold-text);font-size:15px;font-weight:500;padding:8px 4px;min-height:44px;text-align:left}
.row-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.row-line:first-child{border-top:none;padding-top:2px}
.card .row-line:first-child{padding-top:0}
.grow{flex:1;min-width:0}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.saved-note{font-size:13.5px;color:var(--gold-text);min-height:20px;margin:6px 0 0}
.quiet-line{color:var(--muted);font-size:15px;margin:8px 0 0}
.card-label{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.icon-btn{background:none;border:none;color:var(--muted);font-size:22px;line-height:1;width:44px;height:44px;flex:none;border-radius:12px}

/* Hero */
.hero{padding:20px 0 4px}
.hero-art{object-position:50% 30%;width:100%;height:26vh;min-height:150px;max-height:210px;object-fit:cover;border-radius:var(--r-card);display:block;margin-top:8px}
.sleep-art{object-position:50% 25%;width:100%;height:104px;object-fit:cover;border-radius:var(--r-card);display:block;margin-top:8px}
.value-block{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:none;padding:18px 0 10px;text-align:center;width:100%}
.value-num{font-size:clamp(22px,7.2vw,28px);font-weight:500;color:var(--ink);line-height:1.15;max-width:100%;white-space:nowrap;letter-spacing:-.01em}
.night-value{font-size:clamp(44px,13vw,60px);font-weight:600;line-height:1.05;letter-spacing:-.02em}
.dawn-level-row{display:flex;font-size:13px;color:var(--muted)}
.pinned-finish{position:sticky;bottom:12px;z-index:20;margin-top:16px;box-shadow:0 10px 28px rgba(94,72,32,.22)}
/* Night instrument (Critic N) — gold budget at night: level fill + finish button + sun marker only. */
.night-phase{font-family:var(--serif);font-size:20px;line-height:1.25;color:var(--ink);margin:0}
.seg-strip{display:flex;overflow:hidden;margin:16px 0 8px;gap:2px;height:54px;border-radius:18px}
.seg-strip span{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;white-space:nowrap}
.seg-strip span.past{opacity:.38}
.seg-times{position:relative;height:22px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg-times span{position:absolute;white-space:nowrap}
.dawn-level{position:relative;height:14px;border-radius:999px;background:var(--sunken);overflow:hidden;margin:14px 0 6px}
.dawn-level-fill{height:100%;border-radius:999px;background:var(--gold);transition:width .8s ease}
.dawn-tick{position:absolute;top:0;width:1.5px;height:100%;background:var(--canvas);opacity:.55}
.dawn-fill-anim{transform-origin:left center;transition:transform .8s var(--ease)}
@keyframes dawnBreath{0%,100%{opacity:1}50%{opacity:.82}}
.dawn-breath{animation:dawnBreath 4s ease-in-out infinite}
.loss-big{display:flex;align-items:baseline;gap:7px;width:100%;background:none;border:none;text-align:left;padding:10px 0 2px;cursor:pointer;color:var(--ink)}
.loss-big .lb-arrow{font-size:22px;font-weight:700;color:var(--ink)}
.loss-big .lb-amt{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.loss-big .lb-per{font-size:14px;color:var(--muted)}
@keyframes lossPulse{0%{opacity:.35}100%{opacity:1}}
.loss-pulse{animation:lossPulse var(--dur-med) ease}
.cd-hero{font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ink)}
.cd-cap{font-size:13px;color:var(--muted)}
.tier-row{border-left:3px solid transparent;padding-left:8px}
.tier-row.passed{opacity:.45}
.tier-row.now{background:var(--gold-tint);border-radius:0 10px 10px 0}
.guide-actions-sticky{position:sticky;bottom:0;background:var(--canvas);padding:10px 0 calc(6px + env(safe-area-inset-bottom))}
@media (max-height:600px){.guide-panel .why-art{height:84px !important;aspect-ratio:16/6}}
.why-art,.hero-art,.sleep-art{aspect-ratio:auto}
.rec-row .rec-line2{display:contents}
.value-cap{display:block;font-size:14px;line-height:1.4;color:var(--muted)}



/* Sleep */
.sleep-hero{text-align:center;padding:22px 0 18px}
.sleep-hero-label{font-size:16px;color:var(--muted);margin:0}
.sleep-hero-time{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.15;margin:2px 0 0;color:var(--ink)}
.sleep-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.sleep-card .sc-main,.sleep-card .sc-sub{white-space:nowrap}
.sleep-card{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:18px;gap:2px;text-align:center;background:var(--surface);border:none;box-shadow:var(--shadow);border-radius:var(--r-card);padding:16px 6px;color:var(--ink);min-width:0;overflow:hidden;min-height:92px}
.sleep-card.sel{background:var(--gold-tint);box-shadow:none}
.sleep-card .sc-main{font-size:16.5px;font-weight:600;color:var(--ink)}
.sleep-card .sc-sub{display:block;font-size:13px;color:var(--muted)}
.aim-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.aim-chip{padding:10px 14px;border-radius:16px;background:var(--sunken);border:none;min-height:44px;font-size:15px;color:var(--ink)}
.aim-chip.sel{background:var(--gold-tint);color:var(--ink);font-weight:600}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:48px;height:48px;border-radius:var(--r-btn);border:none;background:var(--sunken);color:var(--ink);font-size:22px}
.stepper .step-val{min-width:110px;text-align:center;font-weight:600;color:var(--ink)}
details.why{margin-top:18px}
details.why summary{color:var(--gold-text);font-size:15px;font-weight:500;cursor:pointer;min-height:44px;display:flex;align-items:center;list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why p{color:var(--muted);font-size:15px;margin:4px 0 0}

/* Switch */
.switch{position:relative;display:inline-flex;align-items:center;flex:none;min-height:44px;padding:6px 0}
.switch input{position:absolute;opacity:0;width:52px;height:44px;top:0;margin:0;cursor:pointer}
.switch .track{display:block;width:52px;height:32px;border-radius:16px;background:var(--sunken);position:relative;pointer-events:none}
.switch .track::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow)}
.switch input:checked + .track{background:var(--gold)}
.switch input:checked + .track::after{left:24px}
.switch input:focus-visible + .track{outline:2px solid var(--gold);outline-offset:2px}

/* Medal — box model contract: nothing inside may extend past the
   circle (the earned badge sits INSIDE the edge), so the medallion's
   scroll size never exceeds its client size at any width. */
.medal{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid;flex:none;position:relative;box-sizing:border-box;line-height:0}
.medal svg{display:block;flex:none}
.medal .check{position:absolute;right:0;bottom:0;background:var(--canvas);border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.medal .check svg{width:11px;height:11px}

/* Alarms */
.next-alarm-time{font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.15;margin:0;color:var(--ink)}
.next-alarm-none{font-family:var(--serif);font-size:26px;text-align:center;padding:14px 0 18px;margin:0;color:var(--muted)}
.alarm-time{min-width:92px;white-space:nowrap;font-weight:600;color:var(--ink)}

/* Record */
.week-strip{display:flex;justify-content:space-between;padding:2px 2px 0}
.week-day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.week-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--gold);background:transparent}
.week-dot.filled{background:var(--gold)}
.total-value{font-size:28px;font-weight:500;color:var(--ink);line-height:1.2}
.rec-mark{min-width:64px;text-align:right}
.rec-amt{font-weight:500;color:var(--ink);white-space:nowrap;min-width:86px;text-align:right}
.alarm-rows .row-line{display:grid;grid-template-columns:92px 1fr 52px 44px;align-items:center;column-gap:10px}
.alarm-rows .row-line .switch{justify-self:center}
.alarm-rows .row-line .icon-btn{justify-self:center}

/* Tab bar */
.tabbar{display:flex;flex:none;position:relative;z-index:30;background:var(--surface);border-top:1px solid var(--hair);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;padding:8px 2px;min-height:52px;border-radius:var(--r-btn)}
.tab.active{color:var(--gold-text)}

/* Sheets & overlays */
.scrim{position:fixed;inset:0;background:rgba(46,36,26,0.32);opacity:0;pointer-events:none;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;width:min(480px,100%);background:var(--surface);border:none;border-bottom:none;border-radius:28px 28px 0 0;box-shadow:0 -8px 24px rgba(94,72,32,0.12);padding:24px 20px calc(20px + env(safe-area-inset-bottom));z-index:50;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;visibility:hidden}
.sheet.open{transform:translate(-50%,0);visibility:visible}
.overlay{position:fixed;inset:0;background:var(--canvas);z-index:60;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.overlay-inner{max-width:480px;margin:0 auto;padding:28px 24px calc(56px + env(safe-area-inset-bottom))}
.popup-wrap{position:fixed;inset:0;background:rgba(46,36,26,0.4);z-index:70;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.popup-wrap[hidden]{display:none}
.overlay[hidden]{display:none}
html[data-intro="show"] #guide{display:block !important}
.popup{background:var(--surface);border:none;box-shadow:var(--shadow);border-radius:var(--r-card);padding:24px;width:100%;max-width:420px;margin:auto;max-height:calc(100dvh - 36px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.field{width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-btn);color:var(--ink);font-size:16px;padding:13px 14px;min-height:52px;font-family:inherit}
.choice-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--sunken);border:none;border-radius:16px;padding:14px;color:var(--ink);min-height:56px;margin:0 0 10px;font-size:16px}
.choice-row.sel{background:var(--gold-tint)}
.cr-main{font-weight:600;color:var(--ink);display:block}
.cr-sub{font-size:13.5px;color:var(--muted);display:block}
.eye-btn{background:var(--sunken);border:none;border-radius:var(--r-btn);color:var(--gold-text);min-height:48px;padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:7px;flex:none}
.banner-img{object-position:50% 30%;width:100%;object-fit:cover;border-radius:var(--r-card);display:block}
.devotional{text-align:center;padding:18px 6px 4px}
.devotional .gur{font-family:var(--gurmukhi);font-size:19px;line-height:1.7;display:block;color:var(--ink)}
.devotional .eng{font-style:italic;display:block;font-size:13.5px;color:var(--muted);margin-top:8px}
.back-btn{background:none;border:none;color:var(--gold-text);display:flex;align-items:center;gap:4px;font-size:15px;font-weight:500;padding:10px 0;min-height:44px}
.undo-btn{background:none;border:none;color:var(--gold-text);font-size:14px;min-height:44px;padding:6px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
.sheet,.scrim{transition:transform .25s ease,opacity .25s ease}
.frame,.card,.tabbar,.sheet,.btn-primary,.btn-secondary,.place-chip,.theme-btn{transition:background-color 1.2s ease-in-out,color 1.2s ease-in-out,border-color 1.2s ease-in-out}
.headline-fixed{min-height:110px;display:flex;align-items:flex-start}
.rot-line{font-style:italic;display:block;transition:opacity 1.4s ease-in-out,transform 1.4s ease-in-out}
.rot-line.rot-out{opacity:0;transform:translateY(-4px)}
.rot-line.rot-in{animation:rotRise 1.4s ease-in-out both}
@keyframes rotRise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Stat chain — contract: labels MAY wrap, values NEVER wrap, cells wrap to a second row instead of clipping. One component everywhere. */
.chain{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-card);padding:14px 12px;margin:0 0 16px;text-align:center;align-items:stretch}
.chain>div{flex:1 1 88px;min-width:0;display:flex;flex-direction:column;align-items:center;padding:4px 2px}
.chain .ch-icon{color:var(--gold-text);display:flex;justify-content:center;margin-bottom:4px}
.chain .ch-label{font-size:13px;color:var(--muted);display:block;line-height:1.35;white-space:normal;overflow-wrap:break-word}
.chain .ch-time{font-size:15px;font-weight:600;color:var(--ink);display:block;margin-top:auto;padding-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chain-3>div{flex-basis:100px}
@media(max-width:360px){.chain .ch-time{font-size:14.5px}}
@container (max-width:340px){.chain{gap:4px}.chain .ch-time{font-size:13.5px}.display{font-size:29px}.headline-fixed{min-height:132px}}
@container (max-width:480px){
  .alarm-rows .row-line{grid-template-columns:minmax(64px,auto) 1fr 52px}
  .alarm-rows .row-line>span[aria-hidden]{display:none}
  .alarm-time{min-width:0}
  .sleep-card .sc-sub{font-size:12.5px}
  .tier-row .t-val{font-size:14px}
  .rec-row{flex-wrap:wrap}
  .rec-row .rec-break{flex-basis:100%;height:0}
  .rec-row .rec-line2{flex-basis:100%;display:flex;justify-content:space-between;padding-left:56px;margin-top:2px}
}
.sheet{max-height:calc(100% - 24px);max-height:calc(100svh - 24px);max-height:calc(100dvh - 24px)}
.popup{max-height:calc(100% - 36px);max-height:calc(100svh - 36px);max-height:calc(100dvh - 36px)}
.buffer-row{padding:12px 0 2px}
.buffer-row:first-child{padding-top:0}
.buffer-label{font-weight:600;color:var(--ink);font-size:15px}
.buffer-opts{display:flex;gap:8px;margin-top:8px}
.buffer-opt{flex:1;padding:10px 2px;border-radius:var(--r-btn);background:var(--sunken);border:none;min-height:44px;font-size:14.5px;color:var(--ink)}
.buffer-opt.sel{background:var(--gold-tint);font-weight:600}

/* ===== Why sheets — one idea, room to breathe ===== */
.why-sheet{padding:28px 28px calc(24px + env(safe-area-inset-bottom))}
.why-art{object-position:50% 30%;width:100%;height:132px;object-fit:cover;border-radius:var(--r-card);display:block}
.why-head{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.2;color:var(--ink);margin:26px 0 4px}
.why-chunks{margin-top:6px}
.why-chunk{display:block;margin-top:32px}
.why-vis{color:var(--gold-text);display:block;line-height:0;margin-bottom:6px}
.why-vis svg{width:22px;height:22px}
.why-text{flex:1;min-width:0;font-size:17px;line-height:1.65;color:var(--ink);margin:5px 0 0}
.why-text strong{font-weight:600}
.why-done{margin-top:36px}
.why-open{background:none;border:none;color:var(--gold-text);font-size:15px;font-weight:500;padding:8px 4px;min-height:44px;text-align:left}
.mark-expl{font-size:17px;line-height:1.65;color:var(--ink);margin:8px 0 0}
.mark-times{font-size:15px;color:var(--muted);margin:10px 0 0;line-height:1.65}
.more-body h3{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink);margin:28px 0 8px}
.more-body p,.more-body li{font-size:16.5px;line-height:1.7;color:var(--ink)}
.more-body ul{padding-left:20px;margin:6px 0}
.more-body li{margin:10px 0}

/* ===== Morning window strip — ONE shared component (Why sheet + Today) =====
   A dawn horizon band, then time + label + info together per moment.
   No dots-on-a-line: the band is the horizon, the grid below it carries
   every time and its meaning in the same block. */
.window-sec{margin-top:30px}
.window-title{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.25;color:var(--ink);margin:0}
.window-strip{margin-top:22px}
.ws-band{position:relative;height:34px;border-radius:999px;background:linear-gradient(90deg,var(--gold-tint) 0%,#FBEFD2 30%,#F4DCBB 58%,#E7E3D0 80%,#DCEBF1 100%);box-shadow:inset 0 0 0 1px var(--hair)}
:root[data-theme="dark"] .ws-band{background:linear-gradient(90deg,#202B3C 0%,#2A3242 42%,#35445A 74%,#2C4457 100%);box-shadow:inset 0 0 0 1px var(--hair)}
:root[data-theme="dark"] .ws-band::after{content:"";position:absolute;left:16px;right:16px;top:50%;height:1.5px;margin-top:-0.75px;border-radius:2px;background:var(--gold);opacity:.45}
.ws-marker{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--gold);border:3px solid var(--surface);box-shadow:var(--shadow);transform:translate(-50%,-50%);z-index:2}
.ws-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px;align-items:start}
.ws-moment{min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.ws-time{font-size:19px;font-weight:500;line-height:1.25;color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.ws-label{font-size:14px;font-weight:600;color:var(--ink);margin-top:3px;line-height:1.35}
.ws-info{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.ws-grid.live .ws-moment .ws-time{color:var(--muted)}
.ws-grid.live .ws-moment .ws-label{color:var(--muted);font-weight:500}
.ws-grid.live .ws-moment.now .ws-time{color:var(--gold-text);font-weight:600}
.ws-grid.live .ws-moment.now .ws-label{color:var(--gold-text);font-weight:600}
.ws-grid.live .ws-moment.now .ws-info{color:var(--ink)}
@media (max-width:639px){
  .ws-grid{grid-template-columns:1fr 1fr;gap:20px 22px}
  .ws-time{font-size:18px}
  .ws-band{height:30px}
  .ws-info{min-height:calc(13px*1.45*2)}
  .topbar{padding:14px 16px 6px;gap:8px}
  .place-chip{font-size:13px;padding:10px 12px}
  .sleep-art{height:72px}
}
.today-side{display:none}
@media (max-width:1023px){
  .sleep-grid{display:flex;flex-direction:column}
  .sleep-left,.sleep-right{display:contents}
  .sl-art{order:0}
  .sl-hero{order:1}
  .sl-aim{order:2;margin-top:4px}
  .sl-tiles{order:3;margin-top:12px}
  .sl-chain{order:4;margin-top:16px}
  .sl-buffers{order:5}
  .sl-remind{order:6}
  .sl-other{order:7}
  .sl-why{order:8}
}
/* Guide */
.gift-list{margin-top:18px;border-top:1px solid var(--hair)}
.gift-list p{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:0;padding:8px 2px;border-bottom:1px solid var(--hair);font-size:15.5px}
.gift-list .g-name{color:var(--ink);font-weight:500}
.gift-list .g-val{font-weight:600;color:var(--ink);white-space:nowrap}
.guide-caption{font-size:13.5px;color:var(--muted);margin:14px 0 0;line-height:1.5}
.guide-gur{font-family:var(--gurmukhi);font-size:24px;line-height:1.8;display:block;color:var(--ink);text-align:left}
.guide-seal-trans{font-style:italic;font-size:16px;line-height:1.65;color:var(--muted);margin:14px 0 0}
.chain[data-nav]{cursor:pointer}
.sleep-bridge{margin-top:18px}
@media (max-width:1023px){ .sl-bridge{order:7} }
.guide-panel{animation:guideFade 1.4s ease both}
@keyframes guideFade{from{opacity:0}to{opacity:1}}
.g-dots{display:flex;gap:8px;justify-content:center;margin:26px 0 20px}
.g-dots span{width:8px;height:8px;border-radius:50%;background:var(--sunken)}
.g-dots span.on{background:var(--gold)}
.guide-actions{display:flex;align-items:center;gap:14px}
.guide-actions .btn-primary{flex:1}
.today-window{display:none;margin-top:20px}
.today-window.night{display:block}
.spacious p{font-size:17px;line-height:1.65}

/* ===== Night panel — live window presentation on Today ===== */
.night-panel{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-card);padding:22px 20px 14px}
.night-panel .window-strip{margin-top:20px}
.night-counts{display:flex;flex-wrap:wrap;gap:6px 30px}
.night-count{font-size:15px;color:var(--muted);margin:0}
.night-count strong{color:var(--ink);font-weight:600}
.tier-rows{margin-top:18px;border-top:1px solid var(--hair)}
.tier-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--hair)}
.tier-row:last-child{border-bottom:none}
.tier-row .t-dot{width:9px;height:9px;border-radius:50%;flex:none}
.tier-row .t-name{font-weight:600;min-width:0;color:var(--ink)}
.tier-row .t-time{color:var(--muted);font-size:14.5px}
.tier-row .t-val{margin-left:auto;font-weight:500;color:var(--ink);white-space:nowrap}
.tier-row.now .t-name{color:var(--gold-text)}
.tier-row .t-now{font-size:13px;color:var(--gold-text);font-weight:600}
.loss-line{display:block;background:none;border:none;color:var(--muted);font-size:15px;padding:10px 0 4px;text-align:left;min-height:44px;width:100%}
.loss-line strong{color:var(--ink);font-weight:600}
.why-sheet .window-strip{margin-top:26px}

/* ===== Tablet — same column, wider and airier ===== */
@media (min-width:640px){
  .frame{max-width:640px}
  main{padding:8px 32px 28px}
  .topbar{padding:16px 32px 6px}
  .hero-art{height:30vh;max-height:264px}
  .sleep-art{height:132px}
  .sheet{width:min(560px,100%)}
  .why-sheet{width:min(600px,100%)}
  .overlay-inner{max-width:640px;padding:32px 32px 48px}
}

/* ===== Desktop — the app opens up ===== */
@media (min-width:1024px){
  .frame{max-width:1080px}
  main{padding:12px 40px 28px}
  .topbar{padding:14px 40px 4px}
  .display{font-size:40px}
  .h1{font-size:32px}
  .hero{padding:10px 0 2px}
  .headline-fixed{min-height:92px}
  .hero-art{height:210px;max-height:210px;margin-top:4px}
  .sleep-art{height:150px}
  .value-num{font-size:40px}
  .sleep-hero-time{font-size:44px}
  .next-alarm-time{font-size:44px}
  .today-grid{display:grid;grid-template-columns:55fr 45fr;gap:10px 36px;grid-template-areas:"art art" "main side" "window window";align-items:start}
  .today-art{grid-area:art}
  .today-main{grid-area:main;min-width:0}
  .today-side{display:block;grid-area:side;padding-top:10px}
  .today-window{display:block;grid-area:window;margin-top:22px}
  .today-window .window-strip{margin-top:24px}
  .today-window .ws-band{height:38px}
  .today-window .ws-grid{gap:28px;margin-top:22px}
  .today-window .ws-time{font-size:22px}
  .today-window .ws-label{font-size:15px}
  .today-window .ws-info{font-size:13px}
  .today-side .chain{grid-template-columns:repeat(2,1fr);gap:14px;padding:18px 14px}
  .sleep-grid{display:grid;grid-template-columns:5fr 6fr;gap:36px;align-items:start}
  section[data-screen="alarms"].active,section[data-screen="record"].active{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
  section[data-screen="alarms"].active>*,section[data-screen="record"].active>*{margin-bottom:0}
  section[data-screen="alarms"].active>.hero,section[data-screen="record"].active>.hero,
  section[data-screen="alarms"].active>.span-all,section[data-screen="record"].active>.span-all{grid-column:1/-1}
  .sheet{width:min(600px,100%)}
  .why-sheet{width:min(640px,100%)}
  .overlay-inner{max-width:760px}
  .marks-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .marks-grid .card{margin-bottom:0}
}
@media (min-width:1024px) and (max-height:850px){
  .hero-art{height:168px;max-height:168px}
  .display{font-size:36px}
  .headline-fixed{min-height:84px}
}
/* ===== Pre-ship overflow sweep fixes (EGM loop) =====
   Contract: no component's scroll size may exceed its client size at
   320/360/390 or at the 130%-text proxy widths (246/277/300/331).
   The place chip's ellipsis truncation is exempt by design. */
/* Record total — the amount steps down with its length, and the
   total row stacks under a 480px container so a long total fits. */
.total-value.len-m{font-size:24px}
.total-value.len-l{font-size:21px}
.total-value.len-xl{font-size:18px;letter-spacing:-.02em}
.total-row .grow{min-width:0;max-width:100%}
.total-row .total-value{white-space:nowrap}
/* Record rows — the date cell shrinks/wraps; it is never clipped. */
.rec-row .grow{min-width:0}
.rec-row .d-short{display:none}
.rec-row .icon-btn{flex:none}
/* Alarms — the mark-row grow button may shrink; its sub-line wraps
   to two lines instead of pushing the row wide. */
.alarm-rows .row-line{grid-template-columns:92px minmax(0,1fr) 52px 44px}
.alarm-rows button.grow{min-width:0;overflow:hidden}
.alarm-rows button.grow>span{min-width:0}
.alarm-rows button.grow .small{white-space:normal;line-height:1.35;overflow-wrap:break-word}
/* Night tier rows — the name flexes (and ellipsises) before it clips. */
.tier-row .t-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tier-row .t-name .t-short{display:none}
.tier-row .t-time,.tier-row .t-val{flex:none}
@container (max-width:480px){
  .total-row{flex-direction:column;align-items:flex-start;gap:2px}
  .total-row .total-value{font-size:16px;letter-spacing:-.02em}
  .rec-row{flex-wrap:wrap;row-gap:2px}
  .rec-row .grow{flex:1 1 0;min-width:0;white-space:normal;overflow-wrap:break-word}
  .rec-row .d-long{display:none}
  .rec-row .d-short{display:inline}
  .rec-row .rec-line2{display:flex;flex-basis:100%;order:4;justify-content:space-between;align-items:baseline;gap:12px;padding-left:58px;margin-top:2px;flex-wrap:wrap}
  .rec-row .rec-mark{min-width:0;text-align:left}
  .rec-row .rec-amt{min-width:0;text-align:right}
  .rec-row .icon-btn{order:3}
  .alarm-rows .row-line{grid-template-columns:minmax(0,auto) minmax(0,1fr) 52px}
  .alarm-rows .alarm-time{font-size:14px}
}
@container (max-width:360px){
  .sleep-cards .sleep-card{padding:14px 4px}
  .sleep-cards .sleep-card .sc-main{font-size:15px}
  .sleep-cards .sleep-card .sc-sub{font-size:12px}
  .sleep-cards .sleep-card .sc-asleep{display:none}
}
@container (max-width:340px){
  .tier-row{gap:8px}
  .tier-row .t-name .t-full{display:none}
  .tier-row .t-name .t-short{display:inline}
  .tier-row .t-time{font-size:13px}
  .tier-row .t-val{font-size:13.5px}
}
@container (max-width:300px){
  .sleep-cards .sleep-card{padding:12px 2px}
  .sleep-cards .sleep-card .sc-main{font-size:12px;letter-spacing:-.01em}
  .sleep-cards .sleep-card .sc-sub{font-size:11px}
}
/* Second pass — raw sub-320 viewports (foldables, small phones):
   rows wrap or step down instead of squeezing a column to zero. */
.place-chip>span[aria-hidden]{flex:none}
@container (max-width:360px){
  .rec-row .rec-line2{padding-left:0}
}
@container (max-width:340px){
  .night-value{font-size:37px}
  .loss-big{flex-wrap:wrap}
  .loss-big .lb-amt{font-size:22px}
}
@container (max-width:300px){
  .night-value{font-size:29px}
  .loss-big .lb-amt{font-size:20px}
  .alarm-rows .row-line{display:flex;flex-wrap:wrap;row-gap:4px}
  .alarm-rows button.grow{flex:1 1 150px}
  .tier-row{flex-wrap:wrap}
  .tier-row .t-val{margin-left:auto}
  .tier-row .t-now{display:none}
  }
@container (max-width:260px){
    }
</style>

<h1 class="why-head" style="font-size:30px">The richest hours of your day are the ones you sleep through.</h1>
<p style="font-size:17px;line-height:1.65;margin:10px 0 0">Every night, a few quiet hours before sunrise carry a reward beyond measure. This app helps you be awake for them.</p>

<script>
"use strict";
/* ================= Value model — identical to V1–V4 ================= */
var MULT = 1; /* Multiplier reset (2026-11-06): values are the base anchors — Gold $9,504,367. Existing records migrate to their stored base amounts on load (see migrateRecordsToX1). */
var TIERS = [
  { name: "Gold",   min: 225,  value: 9504367 },
  { name: "Silver", min: 177,  value: 133438 },
  { name: "Milk",   min: 129,  value: 78 },
  { name: "Grain",  min: 81,   value: 65 },
  { name: "Water",  min: 0,    value: 0.5 }
];
var MARKS = {
  Gold:   { color:"#D89A2E", tint:"#F7E8C8", stroke:"#D89A2E", expl:"Counts like giving 50 kg of gold." },
  Silver: { color:"#9AA0A3", tint:"#EFF0F0", stroke:"#9AA0A3", expl:"Counts like donating silver." },
  Milk:   { color:"#CBBB93", tint:"#EFE6D2", stroke:"#CBBB93", expl:"Counts like donating milk." },
  Grain:  { color:"#C8A165", tint:"#F1E3CB", stroke:"#C8A165", expl:"Counts like donating grain." },
  Water:  { color:"#7FA8BC", tint:"#E3EEF3", stroke:"#7FA8BC", expl:"Counts like donating water \u2014 and it still counts." }
};
var MARK_ORDER = ["Gold","Silver","Milk","Grain","Water"];
var SEGMENTS = [
  { name:"Gold",   startMin:360,  endMin:177 },
  { name:"Silver", startMin:177,  endMin:129 },
  { name:"Milk",   startMin:129,  endMin:81 },
  { name:"Grain",  startMin:81,   endMin:40.5 },
  { name:"Water",  startMin:40.5, endMin:0 }
];
function anchorMinFor(mark){ if(mark==="Water") return 40.5; for(var i=0;i<TIERS.length;i++) if(TIERS[i].name===mark) return TIERS[i].min; return 225; }
function segStart(sunrise,name){ for(var i=0;i<SEGMENTS.length;i++) if(SEGMENTS[i].name===name) return new Date(sunrise.getTime()-SEGMENTS[i].startMin*60000); return sunrise; }
function wakeTimeFor(sunrise,mark){ return new Date(sunrise.getTime()-anchorMinFor(mark)*60000); }
function windowOpen(sunrise){ return new Date(sunrise.getTime()-360*60000); }
function anchorTime(sunrise,tier){ return new Date(sunrise.getTime()-tier.min*60000); }
function valueAt(when,sunrise){
  var t=when.getTime(), sr=sunrise.getTime();
  if(t>=sr) return 0;
  var first=anchorTime(sunrise,TIERS[0]).getTime();
  if(t<=first) return TIERS[0].value*MULT;
  for(var i=0;i<TIERS.length-1;i++){
    var t1=anchorTime(sunrise,TIERS[i]).getTime(), t2=anchorTime(sunrise,TIERS[i+1]).getTime();
    if(t>=t1 && t<t2){ var f=(t-t1)/(t2-t1); return TIERS[i].value*Math.pow(TIERS[i+1].value/TIERS[i].value,f)*MULT; }
  }
  return TIERS[TIERS.length-1].value*MULT;
}
function markAt(when,sunrise){
  var mins=(sunrise.getTime()-when.getTime())/60000;
  if(mins<=0||mins>360) return null;
  for(var i=0;i<SEGMENTS.length;i++){ if(mins<=SEGMENTS[i].startMin && mins>SEGMENTS[i].endMin) return SEGMENTS[i].name; }
  return "Water";
}
/* ================= Formatting — all displayed times are in the PLACE's timezone ================= */
function placeTz(){ try{ return (typeof settings!=="undefined" && settings && settings.place && settings.place.tz) || null; }catch(e){ return null; } }
var _tzFmt=null,_tzName=null;
function tzParts(d){
  var tz=placeTz();
  if(!tz) return { y:d.getFullYear(), mo:d.getMonth(), da:d.getDate(), h:d.getHours(), mi:d.getMinutes(), s:d.getSeconds() };
  if(_tzName!==tz){ _tzName=tz; _tzFmt=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}); }
  var o={}; _tzFmt.formatToParts(d).forEach(function(pt){ o[pt.type]=pt.value; });
  return { y:parseInt(o.year,10), mo:parseInt(o.month,10)-1, da:parseInt(o.day,10), h:parseInt(o.hour,10)%24, mi:parseInt(o.minute,10), s:parseInt(o.second,10) };
}
function zonedToUtc(y,mo,da,h,mi){
  if(!placeTz()) return new Date(y,mo,da,h,mi,0,0);
  var want=Date.UTC(y,mo,da,h,mi,0), guess=want;
  for(var i=0;i<3;i++){
    var p=tzParts(new Date(guess));
    var wall=Date.UTC(p.y,p.mo,p.da,p.h,p.mi,p.s);
    var diff=want-wall; guess+=diff; if(diff===0) break;
  }
  return new Date(guess);
}
function normMinute(d){ if(!d||!isFinite(d.getTime())) return null; var x=new Date(d.getTime()); x.setSeconds(0,0); return x; }
function fmtDollars(v){ var n=(typeof v==="number"&&isFinite(v))?v:0; var neg=n<0; n=Math.abs(n); var rc=Math.round(n*100); var d=Math.floor(rc/100); var c=rc%100; var ip=d.toLocaleString("en-CA"); var out=(n<100||c!==0)?("$"+ip+"."+(c<10?"0":"")+c):("$"+ip); return (neg?"-":"")+out; }
function fmtTime(d){ var p=tzParts(d); var ap=p.h>=12?"pm":"am"; var hh=p.h%12; if(hh===0) hh=12; return hh+":"+(p.mi<10?"0":"")+p.mi+" "+ap; }
function fmtDate(d){ var tz=placeTz(); return new Intl.DateTimeFormat("en-CA",{timeZone:tz||undefined,weekday:"long",month:"long",day:"numeric"}).format(d); }
function fmtDateShort(d){ var tz=placeTz(); return new Intl.DateTimeFormat("en-CA",{timeZone:tz||undefined,weekday:"short",month:"short",day:"numeric"}).format(d); }
function fmtDateNoWeekday(d){ var tz=placeTz(); return new Intl.DateTimeFormat("en-CA",{timeZone:tz||undefined,month:"short",day:"numeric"}).format(d); }
function sameDay(a,b){ var x=tzParts(a),y=tzParts(b); return x.y===y.y&&x.mo===y.mo&&x.da===y.da; }
function dayKey(ts){ var p=tzParts(new Date(ts)); return p.y+"-"+p.mo+"-"+p.da; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function durText(ms){ var mins=Math.max(0,Math.round(ms/60000)); if(mins<60) return mins+(mins===1?" minute":" minutes"); var h=Math.floor(mins/60),m=mins%60; return h+(h===1?" hour":" hours")+(m?" "+m+(m===1?" minute":" minutes"):""); }
function sleepText(hours){ if(hours===Math.floor(hours)) return hours+(hours===1?" hour":" hours"); var h=Math.floor(hours),m=Math.round((hours-h)*60); if(m===30) return h+"\u00BD hours"; return h+" hours "+m+" minutes"; }
function dayWordFor(d,now){ if(sameDay(d,now)) return "today"; var tmr=new Date(now.getTime()+86400000); if(sameDay(d,tmr)) return "tomorrow"; return "on "+fmtDateShort(d); }

    if(now.getTime()<state.sunToday.getTime()) return "dark";

    if(state.sunTomorrow && now.getTime()>=state.sunTomorrow.getTime() && state.sunsetTomorrow && now.getTime()<state.sunsetTomorrow.getTime()) return "light";
    return "dark";

    return '<button type="button" class="value-block" id="valueTap"><span class="value-num tnum" id="valueNum" data-val="'+num+'">'+fmtDollars(lastMoney!=null&&Math.abs(lastMoney-num)/Math.max(1,num)<0.5?lastMoney:num)+'</span>'+(cap?'<span class="value-cap">'+esc(cap)+'</span>':"")+'</button><p class="small" id="valueMore"'+(showMore?"":" hidden")+' style="margin:0 0 10px;text-align:center">'+(showMore?esc(moreText):"")+'</p>';
  }
  var art='<img class="hero-art theme-art" data-light="'+IMG.dawnLight+'" data-dark="'+IMG.dawnDark+'" src="'+themedArt(IMG.dawnLight,IMG.dawnDark)+'" alt="" />';
  var quiet='';
  if(ph.id==="night"){
    headline="Still time to rest.";
    moreText="The window opens at "+fmtTime(windowOpen(S))+".";
    statusText="waiting tonight"; valueHtml=valueBlock(fullVal,statusText);
    if(isFirstRun){
      btn='<button type="button" class="btn-primary" data-nav="sleep">Set up tonight</button>';
    } else {
      btn='<button type="button" class="btn-primary" data-nav="sleep">See tonight\u2019s plan</button>';

    headline="Sleep well.";

    btn='<button type="button" class="btn-primary" data-nav="alarms">Check my alarm</button>';
  } else if(ph.id==="open"){
    headline="The Gold window is open.";
    statusText="Reward if you finish now"; valueHtml=valueBlock(valueAt(now,S),statusText);
    moreText="The full reward lasts until "+fmtTime(anchorTime(S,TIERS[0]))+".";

  } else if(ph.id==="declining"){

  } else if(ph.id==="passed"){
    headline="This morning has passed.";
    statusText=""; valueHtml=""; moreText="";

  } else if(ph.id==="recorded"){
    headline="Kept. Waheguru.";
    quiet='<p class="quiet-line">'+winLabel(ph.entry.mark)+' · finished <span class="tnum">'+fmtTime(new Date(ph.entry.ts))+'</span></p>';
    statusText="Saved this morning"; valueHtml=valueBlock(ph.entry.amount,statusText);
    moreText="For the Gold window, Shnaan done by "+fmtTime(finishByFor(S,"Gold"))+".";
    btn='<button type="button" class="btn-primary" data-nav="record">See my mornings</button>';
  } else {
    headline="Tomorrow begins tonight.";
    moreText="Finish by "+fmtTime(anchorTime(S,TIERS[0]))+" for the full Gold window reward.";

    btn=isFirstRun
      ? '<button type="button" class="btn-primary" data-nav="sleep">Set up tonight</button>'
      : '<button type="button" class="btn-primary" data-nav="sleep">See tonight\u2019s plan</button>';

  var barS=(ph.id==="recorded"&&c)?c.srTm:S;
  var barPlan=(ph.id==="recorded"&&c)?planFor(c.srTm):plan;
  var al2=alarmSummaryFor(barS);
  var alarmText = notifState()==="denied" ? 'Alarms are off — notifications are off.'
    : (!settings.master||!al2) ? 'No morning alarm yet — set one in Alarms.'
    : winLabel(al2[0].mark)+' alarm is on for '+fmtTime(al2[0].time)+'.';
  var sideHtml='<aside class="today-side">'
    +'<button type="button" class="chain" data-nav="sleep" aria-label="Tonight\u2019s plan \u2014 open Sleep" style="width:100%;font:inherit;text-align:center">'
    +'<div><span class="ch-icon">'+IC.wind+'</span><span class="ch-label">Wind down</span><span class="ch-time tnum">'+fmtTime(barPlan.windDown)+'</span></div>'
    +'<div><span class="ch-icon">'+IC.bed+'</span><span class="ch-label">Asleep</span><span class="ch-time tnum">'+fmtTime(barPlan.asleepBy)+'</span></div>'
    +'<div><span class="ch-icon">'+IC.sun+'</span><span class="ch-label">Wake</span><span class="ch-time tnum">'+fmtTime(barPlan.wake)+'</span></div>'
    +'<div><span class="ch-icon">'+IC.basin+'</span><span class="ch-label">Shnaan done by</span><span class="ch-time tnum">'+fmtTime(barPlan.finishBy)+'</span></div>'
    +'</button>'

    +'</aside>';
  var isNight=(ph.id==="open"||ph.id==="declining");

    +(isNight

  var promptHtml=(!settings.placeIsDefault||settings.onboarded)?"":'<p class="small" style="margin:12px 0 0">Times are for Caledon \u2014 tap the place name if you\u2019re elsewhere. <button type="button" class="link-btn" id="placePromptX" style="min-height:44px;padding:4px">Dismiss</button></p>';
  var streakN=streakDays();

  var tonightHtml=isWaiting?'<p class="quiet-line" style="text-align:center;margin:10px 0 0">Tonight begins at <strong class="tnum">'+fmtTime(plan.windDown)+'</strong> \u2014 wind down then.</p>':"";
  var phaseWord=ph.id==="open"?"The Gold window is open.":(ph.id==="declining"?(winLabel(markAt(now,S)||"Gold")):"");
  var heroHead=isNightEarly
    ? '<div class="hero"><p class="night-phase" id="nightPhaseWord">'+esc(phaseWord)+'</p>'+quiet+'</div>'
    : '<div class="hero"><h1 class="display headline-fixed"><span class="rot-line" id="rotLine">'+esc(lines[rotIndex])+'</span></h1>'+quiet+'</div>';
  var pinnedHtml=(isNightEarly&&!preview)?'<div class="pinned-finish"><button type="button" class="btn-primary" id="finishBtnPinned">I finished Shnaan</button></div>':"";
  var btnOut=(isNightEarly&&!preview)?"":btn;
  var guideLabel=(settings.guideVersionSeen||0)>=GUIDE_VERSION?"How this works":'<span aria-hidden="true" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);vertical-align:2px;margin-right:6px"></span>Start here <span aria-hidden="true" style="display:inline-block;transform:rotate(180deg);vertical-align:-3px">'+IC.back+'</span>';
  el.innerHTML='<div class="today-grid">'+(isNightEarly?"":'<div class="today-art">'+art+'</div>')+'<div class="today-main">'
    +heroHead
    +valueHtml+btnOut+tonightHtml+streakHtml
    +previewNote+previewNoticeHtml+promptHtml
    +'<p style="margin:14px 0 0"><button type="button" class="why-open" id="whyBtn">Why?</button></p>'
    +'<p style="margin:20px 0 4px"><button type="button" class="link-btn" id="guideLink">'+guideLabel+'</button><button type="button" class="link-btn" id="previewLink" style="margin-left:14px">Preview tonight</button></p>'
    +pinnedHtml
    +'</div>'+sideHtml+bandHtml+'</div>';
  var ep=$("endPreview");
  if(ep) ep.addEventListener("click",function(){ state.preview=null; renderToday(); });
  var ll=$("lossLine");
  if(ll) ll.addEventListener("click",function(){

    else ll.innerHTML='<span class="lb-arrow">\u2193</span><span class="lb-amt tnum" id="lossAmt">'+fmtDollars(Math.max(0,valueAt(nowL,barS)-valueAt(new Date(nowL.getTime()+60000),barS)))+'</span><span class="lb-per">each minute</span>';
  });
  startLiveToday(barS,ph.id);
  var wb=$("whyBtn");
  if(wb) wb.addEventListener("click",function(){
    openWhySheet("Why tonight matters",[
      { v:IC.sun, t:EXPLAIN.teaching.body }
    ],{
      sectionTitle:"Tonight\u2019s five windows",
      sectionHtml:windowStripHTML(barS,now)+'<p style="margin:14px 0 0"><button type="button" class="link-btn" id="whyMarksDoor" data-nav="marks">See all five windows</button></p>',
      sectionChunks:[
        { v:IC.sun, t:'The six hours before sunrise hold the five windows. '+esc(explainWindowBody()) },
        { v:IC.sun, t:'<strong>The Gold window comes first.</strong> Finish inside it and the full reward is counted. After that, the reward falls, step by step.' },
        { v:IC.sun, t:'At <strong>sunrise</strong> the last window ends. Shnaan finished after sunrise does not count for that morning.' }
      ]
    });
    var md=$("whyMarksDoor"); if(md) md.addEventListener("click",function(){ closeSheets(); });
  });
  var gl=$("guideLink"); if(gl) gl.addEventListener("click",function(){ openGuide(); });
  var pvL=$("previewLink"); if(pvL) pvL.addEventListener("click",function(){ state.returnTo="today"; state.focusPreview=true; showScreen("place"); });
  var px=$("placePromptX"); if(px) px.addEventListener("click",function(){ settings.onboarded=true; saveSettings(); renderToday(); });
  var fb=$("finishBtn"); if(fb) fb.addEventListener("click",function(){ openFinishSheet("morning"); });
  var fbp=$("finishBtnPinned"); if(fbp) fbp.addEventListener("click",function(){ openFinishSheet("morning"); });
  var rb=$("recoverBtn"); if(rb) rb.addEventListener("click",function(){ openFinishSheet("recovery"); });
  var vt=$("valueTap");
  if(vt) vt.addEventListener("click",function(){ if(isWaiting) return; var m=$("valueMore"); if(!m) return; m.textContent=moreText; m.hidden=!m.hidden; });

  if(!isNightEarly) startRotation(ph.id,lines);
}

<script>
"use strict";
/* ================= SLEEP — rebuilt user-friendly ================= */
var otherLenOpen=false;
function renderSleep(){
  var el=screenEl("sleep"); var now=new Date();
  if(state.sunUnavailable){
    el.innerHTML='<div class="hero"><h1 class="h1">Sleep</h1><p class="quiet-line">No sunrise today at this place, so there is no plan to count tonight.</p></div>'; return;
  }
  if(!state.sunToday||!state.sunTomorrow||!ctx(now)){
    el.innerHTML='<div class="hero"><h1 class="h1">Sleep</h1><p class="quiet-line">Working out sunrise\u2026</p></div>'; return;
  }
  var c=ctx(now); var S=c.S; var plan=planFor(S);
  var html='<div class="sleep-grid"><div class="sleep-left"><img class="sleep-art sl-art theme-art" data-light="'+IMG.sleepLight+'" data-dark="'+IMG.sleepDark+'" src="'+themedArt(IMG.sleepLight,IMG.sleepDark)+'" alt="" />'
    +'<div class="sleep-hero sl-hero"><p class="sleep-hero-label">Wind down at</p><p class="sleep-hero-time tnum">'+fmtTime(plan.windDown)+'</p></div>'
    +'<div class="chain chain-3 sl-chain">'
    +'<div><span class="ch-icon">'+IC.bed+'</span><span class="ch-label">Asleep</span><span class="ch-time tnum">'+fmtTime(plan.asleepBy)+'</span></div>'
    +'<div><span class="ch-icon">'+IC.sun+'</span><span class="ch-label">Wake</span><span class="ch-time tnum">'+fmtTime(plan.wake)+'</span></div>'
    +'<div><span class="ch-icon">'+IC.basin+'</span><span class="ch-label">Shnaan done by</span><span class="ch-time tnum">'+fmtTime(plan.finishBy)+'</span></div>'
    +'</div></div>'
    +'<div class="sleep-right"><div class="sleep-cards sl-tiles">';
  [6,7.5,9].forEach(function(h){
    var sel=settings.sleepHours===h;
    html+='<button type="button" class="sleep-card'+(sel?" sel":"")+'" data-sleephours="'+h+'"><span class="sc-main">'+sleepText(h)+'</span><span class="sc-sub"><span class="sc-asleep">Asleep </span><span class="tnum">'+fmtTime(new Date(plan.wake.getTime()-h*3600000))+'</span></span></button>';
  });
  html+='</div><div class="sl-aim"><p class="card-label" style="margin:16px 0 8px">Aim to finish in</p><div class="aim-chips" role="group" aria-label="Aim window" style="margin-top:0">';
  MARK_ORDER.forEach(function(m){ html+='<button type="button" class="aim-chip'+(settings.aimMark===m?" sel":"")+'" data-aim="'+m+'">'+winLabel(m)+'</button>'; });
  html+='</div></div>'
    +'<div class="sl-buffers" style="margin-top:22px"><p class="card-label">Time around your sleep</p>'
    +'<div class="buffer-row"><span class="buffer-label">Wind down before sleep</span><div class="buffer-opts">'
    +[15,30,45,60].map(function(v){ return '<button type="button" class="buffer-opt'+(settings.bufferMin===v?" sel":"")+'" data-windbuffer="'+v+'">'+v+' min</button>'; }).join("")
    +'</div></div>'
    +'<div class="buffer-row"><span class="buffer-label">Time for Shnaan</span><span class="small" style="display:block">the dawn bath</span><div class="buffer-opts">'
    +[15,30,45,60].map(function(v){ return '<button type="button" class="buffer-opt'+((settings.morningBuffer==null?30:settings.morningBuffer)===v?" sel":"")+'" data-morningbuffer="'+v+'">'+v+' min</button>'; }).join("")
    +'</div></div></div>'
    +'<div class="card sl-remind"><div class="row-line" style="padding:0"><div class="grow"><strong>Remind me to wind down'+(settings.master?"":" \u2014 alarms are off in Alarms")+'</strong></div>'
    +'<label class="switch"><input type="checkbox" id="windToggle" aria-label="Remind me to wind down"'+(settings.windReminder?" checked":"")+'><span class="track"></span></label></div></div>';
  var isCustom=[6,7.5,9].indexOf(settings.sleepHours)<0;
  var bridgeSum=alarmSummaryFor(S);
  if(bridgeSum && bridgeSum.length){
    html+='<div class="sleep-bridge sl-bridge"><p class="quiet-line" style="margin:0">'+esc(winLabel(bridgeSum[0].mark))+' wake alarm is on for <span class="tnum">'+fmtTime(bridgeSum[0].time)+'</span>.</p></div>';
  } else {
    html+='<div class="sleep-bridge sl-bridge"><p class="quiet-line" style="margin:0 0 6px">No wake alarm yet</p><button type="button" class="btn-secondary" data-nav="alarms">Set my wake alarm</button></div>';
  }
  html+='<details class="why sl-other" id="otherLen"'+(otherLenOpen||isCustom?" open":"")+'><summary>Other length — '+sleepText(settings.sleepHours)+'</summary>'
    +'<div class="stepper" style="margin-top:10px"><button type="button" id="lenMinus" aria-label="Less sleep">−</button>'
    +'<span class="step-val tnum">'+sleepText(settings.sleepHours)+'</span>'
    +'<button type="button" id="lenPlus" aria-label="More sleep">+</button></div></details>'
    +'<p class="sl-why" style="margin:6px 0 0"><button type="button" class="why-open" id="sleepWhyBtn">Why these lengths?</button></p>'
    +'</div></div>';
  el.innerHTML=html;
  el.querySelectorAll("[data-sleephours]").forEach(function(b){
    b.addEventListener("click",function(){ settings.sleepHours=parseFloat(b.getAttribute("data-sleephours")); saveSettings(); renderSleep(); renderChip(); });
  });
  el.querySelectorAll("[data-aim]").forEach(function(b){
    b.addEventListener("click",function(){
      var old=settings.aimMark; settings.aimMark=b.getAttribute("data-aim"); saveSettings();
      if(old!==settings.aimMark && settings.markAlarms[old]){ settings.markAlarms[old]=false; settings.markAlarms[settings.aimMark]=true; saveSettings(); }
      renderSleep(); renderChip();
    });
  });
  var det=$("otherLen");
  if(det) det.addEventListener("toggle",function(){ otherLenOpen=det.open; });
  var step=function(dir){
    var h=Math.round((settings.sleepHours+dir*0.5)*2)/2;
    h=Math.max(4.5,Math.min(10.5,h));
    settings.sleepHours=h; saveSettings(); otherLenOpen=true; renderSleep();
  };
  var lm=$("lenMinus"), lp=$("lenPlus");
  if(lm) lm.addEventListener("click",function(){ step(-1); });
  if(lp) lp.addEventListener("click",function(){ step(1); });
  var wt=$("windToggle");
  if(wt) wt.addEventListener("change",function(){ settings.windReminder=this.checked; saveSettings(); if(this.checked) askNotify(); });
  var swb=$("sleepWhyBtn");
  if(swb) swb.addEventListener("click",function(){
    openWhySheet("Why these lengths",[
      { v:IC.sleep, t:"Sleep runs in <strong>cycles of about ninety minutes</strong> \u2014 light sleep, then deep." },
      { v:IC.sun, t:"These lengths end at the end of a cycle, so <strong>waking up feels easier</strong>." },
      { v:IC.today, t:"Your <strong>wake time never changes</strong> \u2014 a longer sleep just means an earlier bedtime." },
      { v:IC.sleep, t:"Pick the <strong>longest length</strong> your evening honestly allows." },
      { v:IC.alarms, t:EXPLAIN.plan.body }
    ],{ sectionTitle:"Tonight\u2019s five windows", sectionHtml:windowStripHTML(S,new Date()), sectionChunks:[{ v:IC.sun, t:'The six hours before sunrise hold the five windows. '+esc(explainWindowBody()) }] });
  });
  el.querySelectorAll("[data-windbuffer]").forEach(function(b){

  });
  el.querySelectorAll("[data-morningbuffer]").forEach(function(b){
    b.addEventListener("click",function(){ settings.morningBuffer=parseInt(b.getAttribute("data-morningbuffer"),10); saveSettings(); renderSleep(); renderChip(); });
  });
}

/* ================= ALARMS ================= */
function nextMarkAlarmTime(mark,now){
  var t=bufferedWakeFor(state.sunToday,mark);
  if(t.getTime()>now.getTime()) return t;
  return bufferedWakeFor(state.sunTomorrow,mark);
}
function nextMarkSunrise(mark,now){
  if(!state.sunToday) return null;
  return bufferedWakeFor(state.sunToday,mark).getTime()>now.getTime()?state.sunToday:state.sunTomorrow;
}
function renderAlarms(){
  var el=screenEl("alarms"); var now=new Date(); var ns=notifState();
  var best=null;
  if(settings.master && state.sunToday){
    MARK_ORDER.forEach(function(m){ if(settings.markAlarms[m]){ var t=nextMarkAlarmTime(m,now); var sU=nextMarkSunrise(m,now); if(!best||t.getTime()<best.t.getTime()) best={t:t,label:winLabel(m)+" wake-up",doneBy:sU?finishByFor(sU,m):null}; } });
    if(settings.windReminder){
      var cW=ctx(now); var wT=cW&&cW.plan.windDown.getTime()>now.getTime()?cW.plan.windDown:planFor(state.sunTomorrow).windDown;
      if(!best||wT.getTime()<best.t.getTime()) best={t:wT,label:"Wind down"};
    }
    settings.customAlarms.forEach(function(a){ if(!a.enabled) return; var p0=tzParts(now); var t=zonedToUtc(p0.y,p0.mo,p0.da,Math.floor(a.minutes/60),a.minutes%60); if(t.getTime()<=now.getTime()) t=new Date(t.getTime()+86400000); if(!best||t.getTime()<best.t.getTime()) best={t:t,label:a.label}; });
  }
  var html='<div class="hero" style="padding-bottom:0"><h1 class="h1">Alarms</h1></div>';
  if(best){ html+='<div class="span-all" style="text-align:center;padding:8px 0 16px"><p class="next-alarm-time tnum">'+fmtTime(best.t)+'</p><p class="quiet-line" style="margin-top:2px">'+esc(best.label)+(best.doneBy?' · Shnaan done by <span class="tnum">'+fmtTime(best.doneBy)+'</span>':"")+' · '+dayWordFor(best.t,now)+'</p></div>'; }
  else { html+='<p class="next-alarm-none span-all">No alarm is set</p>'; }
  html+='<p class="quiet-line span-all" style="text-align:center;margin:0 0 14px">Alarms ring from this page \u2014 keep it open overnight.</p>';
  if(state.sunToday && ctx(now)){
    var dPlan=ctx(now).plan;
    html+='<div class="card span-all">'
      +'<div class="row-line" style="border-top:none;padding-top:2px"><span class="tnum alarm-time">'+fmtTime(dPlan.windDown)+'</span><span class="grow">Wind down</span></div>'
      +'<div class="row-line"><span class="tnum alarm-time">'+fmtTime(dPlan.wake)+'</span><span class="grow">Wake<span class="small" style="display:block">'+winLabel(settings.aimMark)+' — Shnaan done by <span class="tnum">'+fmtTime(dPlan.finishBy)+'</span></span></span></div>'
      +'</div>';
  }
  if(ns==="denied" && !settings.deniedDismissed){
    html+='<div class="card"><p style="margin:0 0 10px"><strong>Notifications are off.</strong></p>'
      +'<button type="button" class="btn-primary" id="deniedBtn" style="margin-bottom:8px">How to turn them on</button>'
      +'<button type="button" class="link-btn" id="deniedContinue">Continue without alarms</button>'
      +'<p class="small" id="deniedHint" hidden>Settings → Apps → your browser → Notifications → on. Then come back here.</p></div>';
  } else if(ns==="denied"){
    html+='<div class="card"><p style="margin:0">Notifications are off, so alarms can\u2019t reach you.</p></div>';
  } else if(ns==="unsupported") {
    html+='<div class="card"><p style="margin:0">This browser cannot send notifications \u2014 alarms ring from this page, so keep it open overnight.</p></div>';
  } else {
    html+='<div class="card"><div class="row-line" style="padding:0"><div class="grow"><strong>All alarms</strong></div>'
      +'<label class="switch"><input type="checkbox" id="masterToggle" aria-label="All alarms"'+(settings.master?" checked":"")+'><span class="track"></span></label></div></div>';
  }
  html+='<div class="card alarm-rows">';
  MARK_ORDER.forEach(function(m,idx){

  var cdM=document.getElementById("cdMain"), cdN=document.getElementById("cdNext");
  if(phaseId==="declining"){
    if(cdM) cdM.textContent=fmtHMS(S.getTime()-now.getTime());
    if(cdN){ var nb=nextBoundary(now,S); if(nb){ cdN.textContent=fmtHMS(nb.t-now.getTime()); var lb=document.getElementById("cdNextLabel"); if(lb) lb.textContent=nb.next+" window"; } }
  } else {
    if(cdM) cdM.textContent=fmtHMS(goldA.getTime()-now.getTime());
    if(cdN) cdN.textContent=fmtHMS(S.getTime()-now.getTime());
  }
  var mk=document.getElementById("wsMarker");
  if(mk){ var ml=windowMarkerLeft(now,S); if(ml===null) mk.style.display="none"; else { mk.style.display=""; mk.style.left=ml+"%"; } }
  var curIdx=windowCurrentIdx(now,S);
  document.querySelectorAll(".ws-moment").forEach(function(mEl){
    var on=parseInt(mEl.getAttribute("data-ws-idx"),10)===curIdx;
    if(on!==mEl.classList.contains("now")) mEl.classList.toggle("now",on);
  });
  var df=document.getElementById("dawnFill");
  if(df){ var pct2=dawnLevelPct(valueAt(now,S)); df.style.transform="scaleX("+(pct2/100)+")"; }
  var nst=document.getElementById("nightStatus");
  if(nst){ var segNow=markAt(now,S); if(nst.getAttribute("data-seg")!==String(segNow)){ nst.setAttribute("data-seg",String(segNow)); nst.textContent=(segNow?winLabel(segNow):"Night")+". Reward if you finish now "+fmtDollars(valueAt(now,S))+". Sunrise in "+fmtHMS(S.getTime()-now.getTime())+"."; } }
  var la=document.getElementById("lossAmt");
  if(la && phaseId==="declining"){
    if(state.lossPerSec) la.textContent=fmtDollars(Math.max(0,valueAt(now,S)-valueAt(new Date(now.getTime()+1000),S)));
    else la.textContent=fmtDollars(Math.max(0,valueAt(now,S)-valueAt(new Date(now.getTime()+60000),S)));
  }
  var cur=markAt(now,S);
  document.querySelectorAll(".tier-row").forEach(function(r){
    var on=r.getAttribute("data-tier")===cur;
    if(on!==r.classList.contains("now")){ r.classList.toggle("now",on); }
  });
}
/* ===== Serene money glide — rAF interpolation toward the live model value ===== */
var liveToken=0, lastMoney=null;
function prefersReduced(){ return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
function startLiveToday(S,phaseId){
  var token=++liveToken;
  var live=(phaseId==="open"||phaseId==="declining");
  var numEl=document.getElementById("valueNum");
  var target0=live?valueAt(simNow(),S):(numEl?parseFloat(numEl.getAttribute("data-val"))||0:0);
  if(lastMoney==null||prefersReduced()) lastMoney=target0;
  var tweenFrom=lastMoney, tweenStart=null, tweening=!live && Math.abs(target0-tweenFrom)>0.01;
  var prevTs=null, lastSec=-1;
  function frame(ts){
    if(token!==liveToken) return;
    if(state.screen!=="today"){ return; }
    var el=document.getElementById("valueNum");
    if(!el){ requestAnimationFrame(frame); return; }
    var now=simNow();
    var target=live?valueAt(now,S):target0;
    if(prefersReduced()){ lastMoney=target; }
    else if(live){
      if(prevTs==null) prevTs=ts;
      var dt=Math.max(0,ts-prevTs); prevTs=ts;
      var k=1-Math.exp(-dt/220);
      lastMoney+=(target-lastMoney)*k;
      if(Math.abs(target-lastMoney)<0.005) lastMoney=target;
    } else if(tweening){
      if(tweenStart==null) tweenStart=ts;
      var p=Math.min(1,(ts-tweenStart)/1200);
      var e=1-Math.pow(1-p,3); /* soft ease-out */
      lastMoney=tweenFrom+(target0-tweenFrom)*e;
      if(p>=1){ tweening=false; lastMoney=target0; }
    } else { lastMoney=target; }
    var txt=fmtDollars(lastMoney);
    if(el.textContent!==txt) el.textContent=txt;
    if(live){
      var sec=Math.floor(now.getTime()/1000);
      if(sec!==lastSec){ lastSec=sec; updateLiveBits(now,S,phaseId); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function stopLive(){ liveToken++; }

function searchCities(q,cb){
  var gen=++searchGen;
  fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=5&language=en&format=json")
    .then(function(r){ return r.json(); })
    .then(function(j){ if(gen!==searchGen) return; cb((j&&j.results)||[]); })
    .catch(function(){ if(gen!==searchGen) return; cb(null); });
}
function placeLabel(p){ return p.name+(p.admin1?", "+p.admin1:"")+(p.country?", "+p.country:""); }
function applyPlace(p,isDefault){
  sunGen++; searchGen++; locGen++;
  settings.place=p; settings.placeIsDefault=!!isDefault; if(!isDefault) settings.onboarded=true; saveSettings();
  try{ localStorage.removeItem(LS_SUN); }catch(e){}
  state.sunToday=null; state.sunTomorrow=null; state.sunsetToday=null; state.sunsetTomorrow=null; state.sunApprox=false; state.sunError=false; state.sunUnavailable=false; state.exactLanded=false; state.preview=null;

function useMyLocation(done){
  if(!navigator.geolocation){ if(done)done(false,"Location isn\u2019t available here — search for your city instead."); return; }
  var gen=++locGen;
  navigator.geolocation.getCurrentPosition(function(pos){
    if(gen!==locGen) return;
    var lat=parseFloat(pos.coords.latitude.toFixed(4)), lon=parseFloat(pos.coords.longitude.toFixed(4));
    fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=en")
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(gen!==locGen) return;
        var name=(j&&(j.city||j.locality))||"Your location";
        if(j&&j.principalSubdivision) name+=", "+j.principalSubdivision;
        applyPlace({name:name,lat:lat,lon:lon,tz:(j&&j.timeZone)||null},false); if(done)done(true);
      })
      .catch(function(){ if(gen!==locGen) return; applyPlace({name:"Your location",lat:lat,lon:lon,tz:null},false); if(done)done(true); });
  },function(){ if(done)done(false,"Location was blocked — search for your city instead."); },{timeout:10000});
}
