function sunriseForEntry(entry){
  if(state.sunToday && entryInWindow(state.sunToday) && entryInWindow(state.sunToday).ts===entry.ts) return state.sunToday;
  if(state.sunTomorrow && entryInWindow(state.sunTomorrow) && entryInWindow(state.sunTomorrow).ts===entry.ts) return state.sunTomorrow;
  var p=tzParts(new Date(entry.ts));
  var approx=approxSunrise(settings.place.lat,settings.place.lon,{y:p.y,mo:p.mo,da:p.da});
  return approx||null; /* never fabricate an anchor */
}
function openFinishSheet(mode,opts){
  if(state.preview){ state.preview=null; state.previewNotice="End preview to record this morning."; showScreen("today"); return; }
  opts=opts||{};
  var now=new Date();
  if(mode==="edit"){
    var entry=opts.entry||records[opts.index]; if(!entry) return;
    var idx=records.indexOf(entry); if(idx<0) return;
    var SE=sunriseForEntry(entry);
    if(!SE){ finishCtx={mode:"edit",sunrise:null,editIndex:idx,editTs:entry.ts,editEntry:entry,noSunrise:true}; renderFinishSheet(); openSheetEl($("finishSheet")); return; }
    finishCtx={mode:"edit",sunrise:SE,editIndex:idx,editTs:entry.ts,editEntry:entry};
    finishMode="time"; finishMins=15;
    renderFinishSheet(); openSheetEl($("finishSheet"));
    if(finishTimer) clearInterval(finishTimer);
    finishTimer=null;
    return;
  }
  var c=ctx(now); if(!c) return;
  var S=mode==="recovery"?c.srT:c.S;
  if(entryInWindow(S)&&mode==="morning") return;
  finishCtx={mode:mode,sunrise:S};
  finishMode=mode==="recovery"?"time":"now"; finishMins=15;
  renderFinishSheet(); openSheetEl($("finishSheet"));
  if(finishTimer) clearInterval(finishTimer);
  finishTimer=setInterval(function(){ if(finishMode!=="time") renderFinishSheet(true); },1000);
}
function finishTimeFor(){
  var now=new Date(), S=finishCtx.sunrise;
  if(finishMode==="now") return now;
  if(finishMode==="ago") return new Date(now.getTime()-finishMins*60000);
  var input=$("finishTimeInput"); if(!input||!input.value) return null;
  var parts=input.value.split(":");
  var spF=tzParts(S); var cand=zonedToUtc(spF.y,spF.mo,spF.da,parseInt(parts[0],10),parseInt(parts[1],10));
  while(cand.getTime()>now.getTime()+60000) cand=new Date(cand.getTime()-86400000);
  return cand;
}
function finishPreview(){
  if(!finishCtx||!finishCtx.sunrise) return null;
  var ft=finishTimeFor(); if(!ft) return null;
  var S=finishCtx.sunrise;
  var valid=ft.getTime()>=windowOpen(S).getTime()&&ft.getTime()<S.getTime();
  return { time:ft, valid:valid, mark:valid?markAt(ft,S):null, value:valid?valueAt(ft,S):0 };
}
function renderFinishSheet(keepFocus){
  var sheet=$("finishSheet"); if(!finishCtx) return;
  var S=finishCtx.sunrise;
  if(finishCtx.noSunrise){ sheet.innerHTML='<h2 class="h2" style="margin-bottom:6px">Edit this morning</h2><p class="secondary" style="font-size:17px;line-height:1.65">Sunrise for that morning can\u2019t be worked out at this place, so this entry can\u2019t be re-scored safely. Nothing was changed.</p><button type="button" class="btn-secondary" id="finishCancel">Close</button>'; $("finishCancel").addEventListener("click",closeSheets); return; }
  var pv=finishPreview(); var dup=entryInWindow(S);
  if(finishCtx.mode==="edit" && dup && dup.ts===finishCtx.editTs) dup=null;
  var focused=document.activeElement&&document.activeElement.id;
  var isEdit=finishCtx.mode==="edit";
  var html='<h2 class="h2" style="margin-bottom:6px">'+(isEdit?"Edit this morning":"When did you finish?")+'</h2>'
    +'<p class="secondary" style="font-size:17px;line-height:1.65">Which window you reach depends on when you finished.</p>';
  if(isEdit){
    html+="";
  } else if(finishCtx.mode!=="recovery"){
    html+='<button type="button" class="choice-row'+(finishMode==="now"?" sel":"")+'" data-fmode="now"><span class="grow"><span class="cr-main">Just now</span></span></button>'
      +'<button type="button" class="choice-row'+(finishMode==="ago"?" sel":"")+'" data-fmode="ago"><span class="grow"><span class="cr-main">A few minutes ago</span></span></button>';
    if(finishMode==="ago"){
      html+='<div style="display:flex;gap:8px;margin-bottom:12px">';
      [15,30,45].forEach(function(m){ html+='<button type="button" class="choice-row'+(finishMins===m?" sel":"")+'" data-fmins="'+m+'" style="flex:1;justify-content:center"><span class="cr-main tnum">'+m+' min</span></button>'; });
      html+='</div>';
    }
  }
  if(!isEdit) html+='<button type="button" class="choice-row'+(finishMode==="time"?" sel":"")+'" data-fmode="time"><span class="grow"><span class="cr-main">Pick the time</span></span></button>';
  if(finishMode==="time"){
    var def=isEdit?new Date(finishCtx.editTs):new Date(Math.min(new Date().getTime(),S.getTime()-60000));
    html+='<label for="finishTimeInput" style="display:block;margin-bottom:6px">Finish time</label><input type="time" class="field" id="finishTimeInput" value="'+(keepFocus&&focused==="finishTimeInput"&&$("finishTimeInput")?$("finishTimeInput").value:("0"+tzParts(def).h).slice(-2)+":"+("0"+tzParts(def).mi).slice(-2))+'" style="margin-bottom:12px" />';
  }
  if(dup){
    html+='<p class="small" style="color:var(--gold-text)">This morning is already recorded \u2014 '+winLabel(dup.mark)+', '+fmtDollars(dup.amount)+'.</p>';
  } else if(pv&&pv.valid){
    html+='<div class="row-line" style="border-top:1px solid var(--hair);margin-top:4px">'+medallion(pv.mark,48,true)
      +'<div class="grow"><strong>'+winLabel(pv.mark)+'</strong><span class="small" style="display:block">Finished <span class="tnum">'+fmtTime(pv.time)+'</span></span></div>'
      +'<span class="tnum" style="font-weight:600;color:var(--first);font-size:19px">'+fmtDollars(pv.value)+'</span></div>'
      +'<p class="small" style="margin:8px 0 0">'+fmtDollars(pv.value)+' counted for this morning \u2014 the reward of your prayer.</p>';
  } else if(pv){
    html+='<p style="color:var(--gold-text);font-size:16px;line-height:1.6">That time is after sunrise, so it doesn\u2019t count.</p>';
  }
  html+='<p class="small" id="finishSaveError" role="alert" hidden style="color:var(--gold-text);margin:8px 0 0">Couldn\u2019t save on this device \u2014 storage is blocked.</p>'
    +'<button type="button" class="btn-primary" id="finishSave" style="margin:8px 0 10px'+((!pv||!pv.valid||dup)?";opacity:.45":"")+'"'+((!pv||!pv.valid||dup)?" disabled":"")+'>Save this morning</button>'
    +'<button type="button" class="btn-secondary" id="finishCancel">Cancel</button>';
  sheet.innerHTML=html;
  sheet.querySelectorAll("[data-fmode]").forEach(function(b){ b.addEventListener("click",function(){ finishMode=b.getAttribute("data-fmode"); renderFinishSheet(); }); });
  sheet.querySelectorAll("[data-fmins]").forEach(function(b){ b.addEventListener("click",function(){ finishMins=parseInt(b.getAttribute("data-fmins"),10); renderFinishSheet(); }); });
  var ti=$("finishTimeInput");
  if(ti){ ti.addEventListener("change",function(){ renderFinishSheet(true); }); if(keepFocus&&focused==="finishTimeInput") ti.focus(); }
  var sv=$("finishSave"); if(sv) sv.addEventListener("click",saveFinish);
  $("finishCancel").addEventListener("click",closeSheets);
}
function saveFinish(){
  var pv=finishPreview(); if(!pv||!pv.valid) return;
  if(finishCtx.mode==="edit"){
    var dupE=entryInWindow(finishCtx.sunrise);
    if(dupE && dupE.ts!==finishCtx.editTs) return;
    var idx=finishCtx.editIndex;
    if(idx<0||idx>=records.length||records[idx].ts!==finishCtx.editTs){
      idx=records.findIndex(function(e){ return e.ts===finishCtx.editTs; });
      if(idx<0) return;
    }
    var edited={ ts:pv.time.getTime(), amount:Math.round(pv.value*100)/100, base:Math.round((pv.value/MULT)*100)/100, mark:pv.mark, day:dayKey(pv.time.getTime()), tz:placeTz() };
    var prevRec=records[idx];
    records[idx]=edited;
    records.sort(function(a,b){ return b.ts-a.ts; });
    if(!saveRecords()){ records[records.indexOf(edited)]=prevRec; records.sort(function(a,b){ return b.ts-a.ts; }); var fe=$("finishSaveError"); if(fe) fe.hidden=false; return; }
    closeSheets(); showReveal(edited,false); renderRecord();
    return;
  }
  if(entryInWindow(finishCtx.sunrise)) return;
  var entry={ ts:pv.time.getTime(), amount:Math.round(pv.value*100)/100, base:Math.round((pv.value/MULT)*100)/100, mark:pv.mark, day:dayKey(pv.time.getTime()), tz:placeTz() };
  var firstEver=records.length===0;
  records.unshift(entry); records.sort(function(a,b){ return b.ts-a.ts; });
  if(!saveRecords()){ records=records.filter(function(e){ return e!==entry; }); var fe2=$("finishSaveError"); if(fe2) fe2.hidden=false; return; }
  closeSheets(); showReveal(entry,firstEver); renderToday();
}
function showReveal(entry,firstEver){
  var S=finishCtx?finishCtx.sunrise:state.sunToday;
  var minsBefore=Math.round((S.getTime()-entry.ts)/60000);
  var el=$("reveal");
  el.innerHTML='<div class="overlay-inner"><div style="text-align:center;padding-top:16px">'
    +medallion(entry.mark,84,true)
    +'<h1 class="h1" style="margin-top:16px">Saved — in the '+winLabel(entry.mark)+'.</h1>'
    +'<p class="secondary">You finished Shnaan at <span class="tnum">'+fmtTime(new Date(entry.ts))+'</span>, '+durText(minsBefore*60000)+' before sunrise.</p>'
    +'<p><strong class="tnum">'+fmtDollars(entry.amount)+'</strong> counted for this morning \u2014 the reward of your prayer.</p>'
    +(firstEver?'<p class="secondary">Your first saved morning. Your total and mornings list live under Record.</p>':"")
    +(entry.mark==="Gold"?'<p class="secondary">That is the Gold window \u2014 like giving 50 kg of gold.</p>':'<p class="secondary">For the Gold window, Shnaan done by <span class="tnum">'+fmtTime(finishByFor(S,"Gold"))+'</span>.</p>')
    +'<div class="devotional"><span class="gur" lang="pa">ਅੰਮ੍ਰਿਤ ਵੇਲਾ ਸਚੁ ਨਾਉ ਵਡਿਆਈ ਵੀਚਾਰੁ ॥</span>'
    +'<span class="eng">In the Amrit Vela, dwell on the True Name and His greatness. \u2014 Japji Sahib</span></div>'
    +'</div><div style="height:22px"></div>'
    +'<button type="button" class="btn-primary" id="revealDone" style="margin-bottom:10px">Done</button>'
    +'<button type="button" class="btn-secondary" id="revealRecord">See my mornings</button></div>';
  lastTrigger=document.activeElement; el.hidden=false; setTimeout(function(){ var b=$("revealDone"); if(b) b.focus(); },60);
  $("revealDone").addEventListener("click",function(){ el.hidden=true; showScreen("today"); });
  $("revealRecord").addEventListener("click",function(){ el.hidden=true; showScreen("record"); });
}

/* ================= Alarm engine ================= */
var audioCtx=null, chimeTimer=null;
function ensureAudio(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
document.addEventListener("pointerdown",ensureAudio,{once:false});
function chimeOnce(){
  if(!audioCtx) return;
  try{
    var t=audioCtx.currentTime;
    [523.25,659.25,783.99].forEach(function(f,i){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=f; o.type="sine"; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t+i*0.35); g.gain.exponentialRampToValueAtTime(0.22,t+i*0.35+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.35+1.4);
      o.start(t+i*0.35); o.stop(t+i*0.35+1.5);
    });
  }catch(e){}
}
function startChime(){ chimeOnce(); if(chimeTimer) clearInterval(chimeTimer); chimeTimer=setInterval(chimeOnce,4000); }
function stopChime(){ if(chimeTimer){ clearInterval(chimeTimer); chimeTimer=null; } }
function fireAlarm(title,body,kind){
  state.firing={title:title,body:body,kind:kind||"other"};
  $("alarmTitle").textContent=title; $("alarmBody").textContent=body;
  var fb=$("alarmFinishBtn"); if(fb) fb.hidden=!(kind==="mark"||kind==="wind"||kind==="test");
  lastTrigger=document.activeElement; $("alarmPopup").hidden=false; ensureAudio(); startChime(); setTimeout(function(){ var b=$("alarmUpBtn"); if(b) b.focus(); },60);
  sendNotification(title,body);
}
$("alarmUpBtn").addEventListener("click",function(){ $("alarmPopup").hidden=true; stopChime(); state.firing=null; });
$("alarmFinishBtn").addEventListener("click",function(){
  $("alarmPopup").hidden=true; stopChime(); state.firing=null;
  if(state.preview){ state.preview=null; state.previewNotice="End preview to record this morning."; showScreen("today"); return; }
  showScreen("today");
  openFinishSheet("morning");
});
$("alarmSnoozeBtn").addEventListener("click",function(){
  $("alarmPopup").hidden=true; stopChime();
  if(state.firing) state.snoozes.push({ at:Date.now()+5*60000, title:state.firing.title, body:state.firing.body, kind:state.firing.kind });
  state.firing=null;
});
function minuteKey(d){ var p=tzParts(d); return p.y+"-"+p.mo+"-"+p.da+"-"+p.h+"-"+p.mi; }
function tick(){
  var now=new Date();
  /* snoozes */
  for(var i=state.snoozes.length-1;i>=0;i--){ if(now.getTime()>=state.snoozes[i].at){ var s=state.snoozes.splice(i,1)[0]; fireAlarm(s.title,s.body,s.kind); } }
  if(!settings.master||!state.sunToday) return;
  var c=ctx(now); if(!c) return;
  var mk=minuteKey(now);
  /* mark alarms — E1: fire inside a 120s due window, keyed by the
     absolute scheduled instant and persisted, so a reload inside the
     minute cannot refire and a repeated DST hour cannot collide. */
  MARK_ORDER.forEach(function(m){
    if(!settings.markAlarms[m]) return;
    [state.sunToday,state.sunTomorrow].forEach(function(S){
      if(!S) return;
      var t=bufferedWakeFor(S,m); var key="mark|"+m+"|"+t.getTime();
      var due=now.getTime()-t.getTime();
      if(due>=0 && due<=120000 && !state.firedKeys[key]){ state.firedKeys[key]=1; persistFired(); fireAlarm("Time to rise \u2014 "+winLabel(m),"Rise now \u2014 for the "+winLabel(m)+", Shnaan is done by "+fmtTime(finishByFor(S,m))+". Sunrise is at "+fmtTime(S)+".","mark"); }
    });
  });
  /* custom alarms */
  settings.customAlarms.forEach(function(a){
    if(!a.enabled) return;
    var p0c=tzParts(now); var sched=zonedToUtc(p0c.y,p0c.mo,p0c.da,Math.floor(a.minutes/60),a.minutes%60);
    var key="custom|"+a.id+"|"+sched.getTime();
    var cdue=now.getTime()-sched.getTime();
    if(cdue>=0 && cdue<=120000 && !state.firedKeys[key] && a.lastFired!==key){ state.firedKeys[key]=1; persistFired(); a.lastFired=key; saveSettings(); fireAlarm(a.label,"It\u2019s "+fmtTime(now)+" now."); }
  });
  /* wind-down reminder */
  if(settings.windReminder){
    var wkey="wind|"+c.plan.windDown.getTime();
    var wdue=now.getTime()-c.plan.windDown.getTime();
    if(wdue>=0 && wdue<=120000 && !state.firedKeys[wkey]){ state.firedKeys[wkey]=1; persistFired(); fireAlarm("Time to wind down","Wind down now: asleep by "+fmtTime(c.plan.asleepBy)+", wake at "+fmtTime(c.plan.wake)+", Shnaan done by "+fmtTime(c.plan.finishBy)+".","wind"); }
  }
}

/* ================= Init & refresh rhythm ================= */
/* Intro-first: build a local model synchronously (cache -> approximation)
   so panel 1 paints with real-looking times and the Guide can open at
   first paint; the network fetch upgrades it silently behind the intro. */
(function bootLocalModel(){
  try{
    var cache=JSON.parse(localStorage.getItem(LS_SUN)||"null");
    var place=settings.place;
    if(cache && place && cache.placeKey===place.lat+","+place.lon && cache.day===dateStr(new Date())){
      state.sunToday=normMinute(new Date(cache.today)); state.sunTomorrow=normMinute(new Date(cache.tomorrow));
      if(cache.sunsetToday) state.sunsetToday=new Date(cache.sunsetToday);
      if(cache.sunsetTomorrow) state.sunsetTomorrow=new Date(cache.sunsetTomorrow);
    }
  }catch(e){}
  if(!state.sunToday && settings.place){
    var td=new Date(), tm=new Date(); tm.setDate(tm.getDate()+1);
    state.sunToday=approxSunrise(settings.place.lat,settings.place.lon,td);
    state.sunTomorrow=approxSunrise(settings.place.lat,settings.place.lon,tm);
    state.sunApprox=true;
  }
})();
/* E16: a new guide version resets the skip allowance. */
if((settings.guideVersionSeen||0)<2 && settings.skipCount){ settings.skipCount=0; saveSettings(); }
/* E10: resolve a missing place timezone from coordinates, once. */
if(settings.place && !settings.place.tz){
  (function(pl){
    fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+pl.lat+"&longitude="+pl.lon+"&localityLanguage=en")
      .then(function(r){ return r.json(); })
      .then(function(j){ if(settings.place===pl && j && j.timeZone){ pl.tz=j.timeZone; saveSettings(); loadSunrises(); renderChip(); renderScreen(state.screen); } else { tzResolveFailed=true; } })
      .catch(function(){ tzResolveFailed=true; });
  })(settings.place);
}
loadSunrises();
renderChip();
showScreen("today");
/* Intro-first: the Guide opens NOW from the local model if this intro
   version is unseen — it never waits for the network (A1/A7). The boot
   buttons in the static panel are wired by renderGuide on first render. */
maybeAutoOpenGuide();
var gb1=$("gSkipBoot"); if(gb1) gb1.addEventListener("click",function(){ skipGuide(); });
var gb2=$("gNextBoot"); if(gb2) gb2.addEventListener("click",function(){ guideStep=1; renderGuide(); });
setInterval(tick,1000);
/* Front page truth: recompute on load, every 30 seconds, and on return. */
setInterval(function(){ var b=document.documentElement.getAttribute("data-theme"); applyTheme(); renderChip(); if(state.screen==="today") renderToday(); if(b!==document.documentElement.getAttribute("data-theme")) renderScreen(state.screen); },30000);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){
    if(dateStr(new Date())!==dateStr(state.sunToday||new Date())) loadSunrises();
    var b2=document.documentElement.getAttribute("data-theme"); applyTheme();
    renderChip(); renderScreen(state.screen);
    if(b2!==document.documentElement.getAttribute("data-theme")) renderScreen(state.screen);
  }
});
</script>
